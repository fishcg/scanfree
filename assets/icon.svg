<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="全民扫描">
  <title>全民扫描</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- 白纸 -->
  <rect x="119" y="88" width="274" height="336" rx="22" fill="#ffffff" />
  <!-- 文字行 -->
  <g fill="#94a3b8">
    <rect x="160" y="212" width="192" height="22" rx="11" />
    <rect x="160" y="262" width="192" height="22" rx="11" />
    <rect x="160" y="312" width="192" height="22" rx="11" />
    <rect x="160" y="362" width="118" height="22" rx="11" />
  </g>
  <!-- 扫描光带 -->
  <g>
    <rect x="0" y="176" width="512" height="14" fill="#facc15" opacity="0.35" />
    <rect x="60" y="173" width="392" height="20" rx="10" fill="#facc15" />
  </g>
</svg>
